<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary and dark" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: var(--ground); font-family: var(--font-body); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-4); }
  .btn { height: 52px; padding: 0 24px; border-radius: var(--radius-md); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:hover { background: var(--accent-hover); }
  .secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
  .dark { background: var(--ink); color: var(--ground); }
</style>
<div class="row">
  <button class="btn primary" type="button">Book plads</button>
  <button class="btn secondary" type="button">Se andre tider</button>
  <button class="btn dark" type="button">Book en gennemgang</button>
</div>
