<!-- @dsCard group="Forms" height=200 subtitle="Label, field, helper text" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: var(--ground); font-family: var(--font-body); color: var(--ink); }
  .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); padding: var(--space-4); }
  .field { display: grid; gap: var(--space-1); }
  label { font-size: 14px; font-weight: 500; }
  input { height: 48px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; }
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .plate { text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .help { font-size: 13px; color: var(--muted); }
</style>
<div class="wrap">
  <div class="field">
    <label for="tf-name">Navn</label>
    <input id="tf-name" type="text" autocomplete="name" value="Mette Holm">
  </div>
  <div class="field">
    <label for="tf-plate">Nummerplade</label>
    <input id="tf-plate" class="plate" type="text" autocapitalize="characters" value="AB 12 345">
    <span class="help">Kameraet åbner porten, når det genkender pladen.</span>
  </div>
</div>
